<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Clothing — YEOM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="clothes-upload.css">
</head>
<body>
  <header class="app-header">
    <img class="header-img" src="yeom_img.png" alt="YEOM logo" />
  </header>
  
  <main class="app">

    <header class="topbar">
      <button class="icon-btn back-btn" type="button" aria-label="Go back">←</button>
      <h1>ADD CLOTHING</h1>
      <div class="topbar-spacer"></div>
    </header>

    <section class="photo-card" id="photoCard">

  <img
    id="clothingPreview"
    src=""
    alt="Clothing preview"
  >

  <div id="photoPlaceholder" class="photo-placeholder">
    <div class="photo-icon">
      <!-- your icon here -->
    </div>

    <span>Add a photo</span>
  </div>

  <!-- Only appears AFTER an image is uploaded -->
  <button
  id="removeBgBtn"
  class="remove-bg-btn"
  type="button"
  aria-label="Remove background"
  title="Remove background"
>
  <svg
    xmlns="http://www.w3.org/2000/svg"
    width="20"
    height="20"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="m15 4 5 5"/>
    <path d="M13 6 4 15l-1 4 4-1 9-9"/>
    <path d="m14 5 5 5"/>
    <path d="m19 2 .5 1.5L21 4l-1.5.5L19 6l-.5-1.5L17 4l1.5-.5Z"/>
    <path d="m21 12 .5 1.5L23 14l-1.5.5L21 16l-.5-1.5L19 14l1.5-.5Z"/>
  </svg>
  </button>

  <input
    id="photoInput"
    type="file"
    accept="image/*"
    hidden
  >

    </section>

    <form id="clothingForm">

      <section class="form-section">
        <label>Category <span>*</span></label>

        <div class="category-grid" id="categoryGrid">
          <button class="category-option selected" type="button" data-value="Top">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shirt preview-icon"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>
            <span>Top</span>
          </button>

          <button class="category-option" type="button" data-value="Bottom">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" id="Pants--Streamline-Phosphor" height="24" width="24"><desc>Pants Streamline Icon: https://streamlinehq.com</desc> <path d="m22.8418125 21.7246125 -2.48769375 -19.901531249999998c-0.11399999999999999 -0.9048562499999999 -0.8836499999999999 -1.5834000000000001 -1.795659375 -1.5830812499999998H5.441540625c-0.912009375 -0.00030937499999999997 -1.681659375 0.678225 -1.795659375 1.583071875L1.1581875 21.7246125c-0.13615312499999999 1.080665625 0.706453125 2.0357625 1.795659375 2.0353874999999997h4.601100000000001c0.827728125 0.00014062500000000002 1.5499968750000002 -0.56146875 1.75381875 -1.3637062500000001L12 11.9932125l2.6901 10.39629375c0.20130000000000003 0.8053406249999999 0.9248343750000001 1.3703625000000001 1.7549531250000001 1.37049375h4.601100000000001c1.08920625 0.000375 1.9318125000000002 -0.9547218749999999 1.795659375 -2.0353874999999997Zm-3.5031187499999996 -13.43353125c-1.319175 -0.302803125 -2.360671875 -1.3137937499999999 -2.702540625 -2.6233875h2.3746125Zm-0.780234375 -6.241846875 0.226153125 1.809225H5.2153875l0.226153125 -1.809225ZM4.989234375 5.66769375h2.3746125c-0.34186875 1.30959375 -1.3833656250000002 2.320584375 -2.702540625 2.6233875Zm2.5657125 16.283071875H2.953846875l1.47 -11.790525c2.421140625 -0.25704375 4.376184374999999 -2.092434375 4.7854125000000005 -4.4925468749999995h1.886128125v2.6007656249999997Zm8.887846875000001 -0.006778125L12.9046125 8.268459374999999V5.66769375h1.886128125c0.409228125 2.4001124999999996 2.364271875 4.235503125 4.7854125000000005 4.4925468749999995l1.47 11.790525Z" stroke-width="0.0938"></path></svg>
            <span>Bottom</span>
          </button>

          <button class="category-option" type="button" data-value="Shoes">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" id="Shoe-Line--Streamline-Mingcute" height="24" width="24"><desc> Shoe Line Streamline Icon: https://streamlinehq.com</desc> <g fill="none" fill-rule="evenodd"> <path d="M24 0v24H0V0h24ZM12.593 23.258l-0.011 0.002 -0.071 0.035 -0.02 0.004 -0.014 -0.004 -0.071 -0.035c-0.01 -0.004 -0.019 -0.001 -0.024 0.005l-0.004 0.01 -0.017 0.428 0.005 0.02 0.01 0.013 0.104 0.074 0.015 0.004 0.012 -0.004 0.104 -0.074 0.012 -0.016 0.004 -0.017 -0.017 -0.427c-0.002 -0.01 -0.009 -0.017 -0.017 -0.018Zm0.265 -0.113 -0.013 0.002 -0.185 0.093 -0.01 0.01 -0.003 0.011 0.018 0.43 0.005 0.012 0.008 0.007 0.201 0.093c0.012 0.004 0.023 0 0.029 -0.008l0.004 -0.014 -0.034 -0.614c-0.003 -0.012 -0.01 -0.02 -0.02 -0.022Zm-0.715 0.002a0.023 0.023 0 0 0 -0.027 0.006l-0.006 0.014 -0.034 0.614c0 0.012 0.007 0.02 0.017 0.024l0.015 -0.002 0.201 -0.093 0.01 -0.008 0.004 -0.011 0.017 -0.43 -0.003 -0.012 -0.01 -0.01 -0.184 -0.092Z" stroke-width="1"></path> <path fill="currentColor" d="M18.026 3.902c-0.152 -0.263 -0.448 -0.492 -0.716 -0.492 -0.48 0 -1.097 0.48 -1.47 0.771 -0.559 0.435 -1.211 0.848 -1.911 0.992 -0.518 0.105 -1.136 0.026 -1.682 -0.117 -0.09 -0.023 -0.864 -0.294 -0.864 -0.294 -1.072 -0.495 -1.548 0.912 -1.971 1.605 -0.29 0.473 -0.655 1.037 -1.07 1.606a1 1 0 0 0 -1.04 1.314c-0.308 0.377 -0.6 0.738 -0.877 1.086A1 1 0 0 0 5.29 11.84c-1.072 1.433 -1.81 2.598 -2.236 3.635 -0.36 0.88 -0.514 1.703 -0.447 2.542 0.067 0.827 0.342 1.598 0.727 2.376 0.522 1.055 1.802 1.344 2.739 0.803l14.722 -8.5a2 2 0 0 0 0.732 -2.732l-3.5 -6.062Zm0.268 4.464 -1.419 -2.457c-0.764 0.546 -1.617 1.033 -2.545 1.223 -0.954 0.195 -1.919 0.034 -2.587 -0.14 -0.411 -0.107 -0.404 0.057 -0.625 0.418 -0.252 0.413 -0.564 0.899 -0.92 1.406l0.111 0.055a1 1 0 1 1 -0.886 1.793l-0.473 -0.234c-0.238 0.292 -0.464 0.57 -0.68 0.84a1 1 0 0 1 -0.945 1.76l-0.312 -0.154c-1.086 1.437 -1.752 2.487 -2.11 3.358 -0.265 0.647 -0.34 1.154 -0.303 1.623 0.037 0.466 0.192 0.964 0.498 1.592l14.696 -8.485 -0.5 -0.866 -4.33 2.5a1 1 0 0 1 -1 -1.732l4.33 -2.5Z" stroke-width="1"></path> </g></svg>
            <span>Shoes</span>
          </button>

          <button class="category-option" type="button" data-value="Outerwear">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" id="Coat-Fill--Streamline-Mingcute-Fill" height="24" width="24"> <desc>  Coat Fill Streamline Icon: https://streamlinehq.com  </desc> <g fill="none" fill-rule="evenodd"><path d="M24 0v24H0V0h24ZM12.593 23.258l-0.011 0.002 -0.071 0.035 -0.02 0.004 -0.014 -0.004 -0.071 -0.035c-0.01 -0.004 -0.019 -0.001 -0.024 0.005l-0.004 0.01 -0.017 0.428 0.005 0.02 0.01 0.013 0.104 0.074 0.015 0.004 0.012 -0.004 0.104 -0.074 0.012 -0.016 0.004 -0.017 -0.017 -0.427c-0.002 -0.01 -0.009 -0.017 -0.017 -0.018Zm0.265 -0.113 -0.013 0.002 -0.185 0.093 -0.01 0.01 -0.003 0.011 0.018 0.43 0.005 0.012 0.008 0.007 0.201 0.093c0.012 0.004 0.023 0 0.029 -0.008l0.004 -0.014 -0.034 -0.614c-0.003 -0.012 -0.01 -0.02 -0.02 -0.022Zm-0.715 0.002a0.023 0.023 0 0 0 -0.027 0.006l-0.006 0.014 -0.034 0.614c0 0.012 0.007 0.02 0.017 0.024l0.015 -0.002 0.201 -0.093 0.01 -0.008 0.004 -0.011 0.017 -0.43 -0.003 -0.012 -0.01 -0.01 -0.184 -0.092Z" stroke-width="1"></path><path fill="currentColor" d="M13.528 3a3 3 0 0 1 1.342 0.317l2.03 1.016a5 5 0 0 1 2.553 3.035l2.262 7.539a2 2 0 0 1 -1.021 2.364l-1.012 0.505a1 1 0 0 1 -1.192 -0.227L18 17l-0.268 1.752A3.002 3.002 0 0 1 14.826 21H9.174a3.002 3.002 0 0 1 -2.906 -2.248L6 17l-0.49 0.549a1 1 0 0 1 -1.193 0.227l-1.012 -0.505a2 2 0 0 1 -1.021 -2.364l2.262 -7.539a5 5 0 0 1 2.553 -3.035L9.13 3.317A3 3 0 0 1 10.472 3h3.056Zm0 2h-3.056a1 1 0 0 0 -0.34 0.06l-0.107 0.046 -0.96 0.48L12 10.15l2.935 -4.566 -0.96 -0.48a1 1 0 0 0 -0.331 -0.098L13.528 5Z" stroke-width="1"></path></g></svg>
            <span>Outerwear</span>
          </button>
        </div>
      </section>

      <section class="form-section">
        <label for="type">Type <span>*</span></label>
        <div class="select-wrap">
          <select id="type" required>
            <option value="T-shirt">T-shirt</option>
            <option value="Shirt">Shirt</option>
            <option value="Polo">Polo</option>
            <option value="Hoodie">Hoodie</option>
            <option value="Sweater">Sweater</option>
            <option value="Tank Top">Tank Top</option>
          </select>
        </div>
      </section>

      <section class="form-section">
        <label for="colour">Colour <span>*</span></label>
        <div class="select-wrap colour-select">
          <span id="colourDot" class="colour-dot"></span>
          <select id="colour" required>
            <option value="Red" data-colour="#d9252a">Red</option>
            <option value="Black" data-colour="#111111">Black</option>
            <option value="White" data-colour="#f4f4f4">White</option>
            <option value="Blue" data-colour="#2864c7">Blue</option>
            <option value="Green" data-colour="#27734b">Green</option>
            <option value="Yellow" data-colour="#e6bd20">Yellow</option>
            <option value="Grey" data-colour="#8c8c8c">Grey</option>
            <option value="Brown" data-colour="#80583c">Brown</option>
            <option value="Other" data-colour="#b8b8b8">Other</option>
          </select>
        </div>
      </section>

      <section class="form-section">
        <label>Where would you wear this <span>*</span></label>

        <div class="occasion-list" id="occasionList">
          <button class="pill selected" type="button" data-value="Casual walk">Casual walk</button>
          <button class="pill" type="button" data-value="College">College</button>
          <button class="pill" type="button" data-value="Party">Party</button>
          <button class="pill" type="button" data-value="Sports">Sports</button>
          <button class="pill" type="button" data-value="Home">Home</button>
          <button class="pill" type="button" data-value="Date">Date</button>
          <button class="pill" type="button" data-value="Travel">Travel</button>
        </div>
      </section>

      <button class="submit-btn" type="submit">
        <span>ADD TO WARDROBE</span>
        <span class="arrow">→</span>
      </button>

      <p id="status" class="status" aria-live="polite"></p>

    </form>
  </main>

  <script src="clothes-upload.js"></script>
</body>
</html>
