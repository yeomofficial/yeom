<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Clothing — YEOM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="clothes-upload.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <main class="app">

    <header class="topbar">
      <button class="icon-btn back-btn" type="button" aria-label="Go back">←</button>
      <h1>ADD CLOTHING</h1>
      <div class="topbar-spacer"></div>
    </header>

    <section class="photo-card">
      <img id="clothingPreview" src="" alt="Clothing preview">
      <div id="photoPlaceholder" class="photo-placeholder">
        <div class="hanger-icon">♧</div>
        <span>Add a photo</span>
      </div>

      <div class="photo-actions">
        <button id="editPhotoBtn" class="round-btn" type="button" aria-label="Edit photo">✎</button>
        <button id="uploadPhotoBtn" class="round-btn" type="button" aria-label="Choose photo">⌗</button>
      </div>

      <input id="photoInput" type="file" accept="image/*" hidden>
    </section>

    <form id="clothingForm">

      <section class="form-section">
        <label>Category <span>*</span></label>

        <div class="category-grid" id="categoryGrid">
          <button class="category-option selected" type="button" data-value="Top">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shirt preview-icon"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>
            <span>Top</span>
          </button>

          <button class="category-option" type="button" data-value="Bottom">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" id="Pants--Streamline-Phosphor"> <desc> Pants Streamline Icon: https://streamlinehq.com</desc><path d="m243.646 231.7292 -26.5354 -212.283c-1.216 -9.6518 -9.4256 -16.8896 -19.1537 -16.8862H58.0431c-9.7281 -0.0033 -17.9377 7.2344 -19.1537 16.8861L12.354 231.7292c-1.4523 11.5271 7.5355 21.7148 19.1537 21.7108h49.0784c8.8291 0.0015 16.5333 -5.989 18.7074 -14.5462L128 127.9276l28.6944 110.8938c2.1472 8.5903 9.8649 14.6172 18.7195 14.6186h49.0784c11.6182 0.004 20.606 -10.1837 19.1537 -21.7108Zm-37.3666 -143.291c-14.0712 -3.2299 -25.1805 -14.0138 -28.8271 -27.9828h25.3292Zm-8.3225 -66.5797 2.4123 19.2984H55.6308l2.4123 -19.2984ZM53.2185 60.4554h25.3292c-3.6466 13.969 -14.7559 24.7529 -28.8271 27.9828Zm27.3676 173.6861H31.5077l15.68 -125.7656c25.8255 -2.7418 46.6793 -22.3193 51.0444 -47.9205h20.1187v27.7415Zm94.8037 -0.0723L137.6492 88.1969V60.4554h20.1187c4.3651 25.6012 25.2189 45.1787 51.0444 47.9205l15.68 125.7656Z" stroke-width="1"></path> </svg>
            <span>Bottom</span>
          </button>

          <button class="category-option" type="button" data-value="Shoes">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" id="Shoe-Line--Streamline-Mingcute" height="24" width="24"><desc> Shoe Line Streamline Icon: https://streamlinehq.com</desc> <g fill="none" fill-rule="evenodd"> <path d="M24 0v24H0V0h24ZM12.593 23.258l-0.011 0.002 -0.071 0.035 -0.02 0.004 -0.014 -0.004 -0.071 -0.035c-0.01 -0.004 -0.019 -0.001 -0.024 0.005l-0.004 0.01 -0.017 0.428 0.005 0.02 0.01 0.013 0.104 0.074 0.015 0.004 0.012 -0.004 0.104 -0.074 0.012 -0.016 0.004 -0.017 -0.017 -0.427c-0.002 -0.01 -0.009 -0.017 -0.017 -0.018Zm0.265 -0.113 -0.013 0.002 -0.185 0.093 -0.01 0.01 -0.003 0.011 0.018 0.43 0.005 0.012 0.008 0.007 0.201 0.093c0.012 0.004 0.023 0 0.029 -0.008l0.004 -0.014 -0.034 -0.614c-0.003 -0.012 -0.01 -0.02 -0.02 -0.022Zm-0.715 0.002a0.023 0.023 0 0 0 -0.027 0.006l-0.006 0.014 -0.034 0.614c0 0.012 0.007 0.02 0.017 0.024l0.015 -0.002 0.201 -0.093 0.01 -0.008 0.004 -0.011 0.017 -0.43 -0.003 -0.012 -0.01 -0.01 -0.184 -0.092Z" stroke-width="1"></path> <path fill="currentColor" d="M18.026 3.902c-0.152 -0.263 -0.448 -0.492 -0.716 -0.492 -0.48 0 -1.097 0.48 -1.47 0.771 -0.559 0.435 -1.211 0.848 -1.911 0.992 -0.518 0.105 -1.136 0.026 -1.682 -0.117 -0.09 -0.023 -0.864 -0.294 -0.864 -0.294 -1.072 -0.495 -1.548 0.912 -1.971 1.605 -0.29 0.473 -0.655 1.037 -1.07 1.606a1 1 0 0 0 -1.04 1.314c-0.308 0.377 -0.6 0.738 -0.877 1.086A1 1 0 0 0 5.29 11.84c-1.072 1.433 -1.81 2.598 -2.236 3.635 -0.36 0.88 -0.514 1.703 -0.447 2.542 0.067 0.827 0.342 1.598 0.727 2.376 0.522 1.055 1.802 1.344 2.739 0.803l14.722 -8.5a2 2 0 0 0 0.732 -2.732l-3.5 -6.062Zm0.268 4.464 -1.419 -2.457c-0.764 0.546 -1.617 1.033 -2.545 1.223 -0.954 0.195 -1.919 0.034 -2.587 -0.14 -0.411 -0.107 -0.404 0.057 -0.625 0.418 -0.252 0.413 -0.564 0.899 -0.92 1.406l0.111 0.055a1 1 0 1 1 -0.886 1.793l-0.473 -0.234c-0.238 0.292 -0.464 0.57 -0.68 0.84a1 1 0 0 1 -0.945 1.76l-0.312 -0.154c-1.086 1.437 -1.752 2.487 -2.11 3.358 -0.265 0.647 -0.34 1.154 -0.303 1.623 0.037 0.466 0.192 0.964 0.498 1.592l14.696 -8.485 -0.5 -0.866 -4.33 2.5a1 1 0 0 1 -1 -1.732l4.33 -2.5Z" stroke-width="1"></path> </g></svg>
            <span>Shoes</span>
          </button>

          <button class="category-option" type="button" data-value="Outerwear">
            <span class="category-icon">◇</span>
            <span>Outerwear</span>
          </button>

          <button class="category-option" type="button" data-value="Full Set">
            <span class="category-icon">♧</span>
            <span>Full Set</span>
          </button>
        </div>
      </section>

      <section class="form-section">
        <label for="type">Type <span>*</span></label>
        <div class="select-wrap">
          <select id="type" required>
            <option value="T-shirt">T-shirt</option>
            <option value="Shirt">Shirt</option>
            <option value="Polo">Polo</option>
            <option value="Hoodie">Hoodie</option>
            <option value="Sweater">Sweater</option>
            <option value="Tank Top">Tank Top</option>
          </select>
        </div>
      </section>

      <section class="form-section">
        <label for="colour">Colour <span>*</span></label>
        <div class="select-wrap colour-select">
          <span id="colourDot" class="colour-dot"></span>
          <select id="colour" required>
            <option value="Red" data-colour="#d9252a">Red</option>
            <option value="Black" data-colour="#111111">Black</option>
            <option value="White" data-colour="#f4f4f4">White</option>
            <option value="Blue" data-colour="#2864c7">Blue</option>
            <option value="Green" data-colour="#27734b">Green</option>
            <option value="Yellow" data-colour="#e6bd20">Yellow</option>
            <option value="Grey" data-colour="#8c8c8c">Grey</option>
            <option value="Brown" data-colour="#80583c">Brown</option>
            <option value="Other" data-colour="#b8b8b8">Other</option>
          </select>
        </div>
      </section>

      <section class="form-section">
        <label>Where would you wear this <span>*</span></label>

        <div class="occasion-list" id="occasionList">
          <button class="pill selected" type="button" data-value="Casual walk">Casual walk</button>
          <button class="pill" type="button" data-value="College">College</button>
          <button class="pill" type="button" data-value="Party">Party</button>
          <button class="pill" type="button" data-value="Sports">Sports</button>
          <button class="pill" type="button" data-value="Home">Home</button>
          <button class="pill" type="button" data-value="Date">Date</button>
          <button class="pill" type="button" data-value="Travel">Travel</button>
        </div>
      </section>

      <button class="submit-btn" type="submit">
        <span>ADD TO WARDROBE</span>
        <span class="arrow">→</span>
      </button>

      <p id="status" class="status" aria-live="polite"></p>

    </form>
  </main>

  <script src="clothes-upload.js"></script>
</body>
</html>
